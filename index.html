<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Haritada Aç</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      background: #f5f5f5;
      color: #111;
      padding: 24px;
    }
    .card {
      width: min(92vw, 420px);
      background: #fff;
      border-radius: 22px;
      padding: 28px 22px;
      text-align: center;
      box-shadow: 0 14px 40px rgba(0,0,0,.12);
    }
    h1 { margin: 0 0 10px; font-size: 27px; }
    p { margin: 0 0 22px; color: #555; line-height: 1.5; }
    a {
      display: block;
      margin: 12px 0;
      padding: 15px 18px;
      border-radius: 14px;
      text-decoration: none;
      font-weight: 700;
      font-size: 16px;
    }
    .apple { background: #111; color: #fff; }
    .google { background: #fff; color: #111; border: 1px solid #ddd; }
  </style>
</head>
<body>
  <main class="card">
    <h1>Konumu Aç</h1>
    <p>Hangi uygulama ile açmak istersin?</p>
    <a class="apple" href="https://maps.apple/p/pK0cKkKC_kkZ7T">Apple Maps ile Aç</a>
    <a class="google" href="https://www.google.com/maps?q=38.27756881713867,26.828279495239258&z=17&hl=tr">Google Maps ile Aç</a>
  </main>
</body>
</html>
